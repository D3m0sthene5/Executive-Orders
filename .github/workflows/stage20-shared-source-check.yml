name: Verify Stage 20 shared-source workbench

on:
  push:
    paths:
      - '.github/workflows/stage20-shared-source-check.yml'
      - 'research/stage20/code/build_shared_source_workbench.mjs'
      - 'research/stage20/code/test_shared_source_workbench.mjs'
      - 'research/stage20/output/SHARED_SOURCE_*'
      - 'research/stage20/code/merge_statute_custody.mjs'
      - 'research/stage20/code/test_statute_custody.mjs'
      - 'research/stage20/output/STATUTE_CASE_REVIEW_QUEUE.csv'
      - 'research/stage20/output/STATUTE_SOURCE_CASE_PACKETS.jsonl'
      - 'research/stage20/output/STATUTE_SOURCE_READY_WORKBENCH.html'
      - 'research/stage20/output/STATUTE_CUSTODY_METRICS.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source files without LFS media
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests for provenance and case-specific gates
        run: node research/stage20/code/test_shared_source_workbench.mjs
      - name: Reproduce all shared-source tasks and HTML byte for byte
        run: node research/stage20/code/build_shared_source_workbench.mjs --check
      - name: Test statutory source-custody merge
        run: node research/stage20/code/test_statute_custody.mjs
      - name: Reproduce the acquired-PDF-to-case reviewer packets
        run: node research/stage20/code/merge_statute_custody.mjs --check
