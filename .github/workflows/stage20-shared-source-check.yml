name: Verify Stage 20 shared-source workbench

# Retired from automatic runs (owner, 2026-11-09, Kean D-20261109-no-push-runs): it ran only when a
# pergamon-* tag push matched its paths, about 79 times in four days, mostly failing. Start it by hand
# (Actions tab -> Run workflow). .github/scripts/test_workflow_triggers.py keeps it manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source files without LFS media
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests for provenance and case-specific gates
        run: node research/stage20/code/test_shared_source_workbench.mjs
      - name: Reproduce all shared-source tasks and HTML byte for byte
        run: node research/stage20/code/build_shared_source_workbench.mjs --check
      - name: Test statutory source-custody merge
        run: node research/stage20/code/test_statute_custody.mjs
      - name: Reproduce the acquired-PDF-to-case reviewer packets
        run: node research/stage20/code/merge_statute_custody.mjs --check
