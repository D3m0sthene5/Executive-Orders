name: Claim publication audit
on:
  pull_request:
    paths: ['research/readiness/claims/**', 'jobs/claim-kit/**', '.github/workflows/claim-publication-audit.yml']
  push:
    branches: [main]
    paths: ['research/readiness/claims/**', 'jobs/claim-kit/**', '.github/workflows/claim-publication-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the real PR head with its base, not GitHub's synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /jobs/
            !/jobs/*/output/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit independent-clone publications
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python jobs/claim-kit/kit.py publication-audit --base "$PR_BASE" > publication-audit.json
          elif [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            python jobs/claim-kit/kit.py publication-audit --merge-commit HEAD > publication-audit.json
          else
            python jobs/claim-kit/kit.py publication-audit --base "$PUSH_BEFORE" > publication-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claim-publication-audit-${{ github.run_id }}
          path: publication-audit.json
