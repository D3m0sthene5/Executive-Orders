name: Compile auditable causal and shared-source research cues

# Retired from automatic runs (owner, 2026-11-09, Kean D-20261109-no-push-runs): it ran only when a
# pergamon-* tag push matched its paths, about 79 times in four days, mostly failing. Start it by hand
# (Actions tab -> Run workflow). .github/scripts/test_workflow_triggers.py keeps it manual.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-evidence-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout text-only evidence references
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Test source-ambiguity and date-cue safety rules
        run: |
          python -m unittest discover -s research/stage20/code -p 'test_causal_cues.py' -v
      - name: Build and independently round-trip check causal cue outputs
        run: |
          python research/stage20/code/build_causal_cues.py
          python research/stage20/code/build_causal_cues.py --check
      - name: Persist evidence cues to main if all checks pass
        run: |
          git config user.name "EO Causal Cue Excavator"
          git config user.email "actions@users.noreply.github.com"
          git add research/stage20/output/CAUSAL_LEAD_PACKETS_844.jsonl \
            research/stage20/output/CAUSAL_LEAD_PRIORITIES_844.csv \
            research/stage20/output/MEDIA_BATCH_ASSOCIATION_AUDIT.csv \
            research/stage20/output/CAUSAL_CUE_SUMMARY.json
          if git diff --cached --quiet; then
            echo "No generated output changes"
          else
            git commit -m "Recover case-level causal date contexts and quantify shared Opus source ambiguity"
            git push origin HEAD:main
          fi
