# Shared script runner. Any agent (Claude, Astra, Codex) or the owner can run a
# script on GitHub's machines by committing it under jobs/<name>/. See
# jobs/README.md for how to write one.
#
# A job runs when a push changes any file in its folder outside output/, or when
# someone starts this workflow by hand (Actions tab -> Run jobs -> Run workflow)
# and types the job name. Jobs whose folder contains a file named DAILY also run
# once a day on the default branch. Results are committed back to the same branch in
# jobs/<name>/output/. Commits made by this workflow do not start it again.

name: Run jobs

on:
  push:
    paths:
      - "jobs/**"
      # Changing the runner reruns jobs/example-hello as a check.
      - ".github/workflows/run-jobs.yml"
      - ".github/scripts/**"
      # Claims, fetch requests and EXHAUSTED records rerun the jobs that read them
      # (each job lists what it reads in triggers.txt).
      - "research/readiness/**"
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily: jobs with a DAILY file
  workflow_dispatch:
    inputs:
      job:
        description: "Job folder name(s) under jobs/, separated by spaces (for example: claim-checker readiness-tracker)"
        required: true

permissions:
  contents: write

# Leave Git LFS files (the multi-GB archive parts) as small pointer files unless
# a job downloads one itself with `git lfs pull --include "<path>"`.
env:
  GIT_LFS_SKIP_SMUDGE: "1"

# No concurrency group: GitHub keeps only one waiting run per group and cancels
# the rest, which skipped jobs when several merges landed at once. Runs that
# finish together are reconciled in commit_results.sh instead.

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # The repo is several GB, so only the runner, jobs and HANDOFF folders are
      # downloaded up front. A job lists any other folders it needs in
      # jobs/<name>/needs.txt and they are added before it runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            jobs
            HANDOFF

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore each job's bounded download cache
        uses: actions/cache@v4
        with:
          path: .job-cache
          key: job-downloads-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-downloads-v1-${{ github.ref_name }}-

      - name: Choose which jobs to run
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_JOB: ${{ github.event.inputs.job }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/pick_jobs.py

      - name: Run the jobs
        if: steps.pick.outputs.jobs != ''
        env:
          JOBS: ${{ steps.pick.outputs.jobs }}
          TRIGGER: ${{ github.event_name }} by ${{ github.actor }}
          # Optional search keys for the Lewis/Clark web search (jobs/_lib/eo_websearch.py). Each is
          # empty unless the owner adds the secret under Settings -> Secrets and variables -> Actions;
          # an engine whose key is empty is skipped and listed as "needs_key" in the job summary.
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
          BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
        run: bash .github/scripts/run_jobs.sh

      - name: Keep oversized files as a download
        if: always() && steps.pick.outputs.jobs != ''
        uses: actions/upload-artifact@v4
        with:
          name: oversized-outputs-${{ github.run_id }}
          path: oversized/
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit results to the branch
        if: always() && steps.pick.outputs.jobs != ''
        env:
          JOBS: ${{ steps.pick.outputs.jobs }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/commit_results.sh
