# Shared script runner. Any agent (Claude, Astra, Codex) or the owner can run a
# script on GitHub's machines by committing it under jobs/<name>/. See
# jobs/README.md for how to write one.
#
# A job runs when someone starts this workflow by hand (Actions tab -> Run jobs -> Run
# workflow, or `gh workflow run run-jobs.yml --ref <branch> -f job=<name> -f only=true`)
# and names it, or in the scheduled sweep on the default branch when its folder or a
# path in its triggers.txt changed since the previous sweep. Jobs whose folder contains
# a file named DAILY also run once a day. Results are committed back to the same
# branch in jobs/<name>/output/. Commits made by this workflow do not start it again.
#
# No push starts this workflow (owner, 2026-11-09, Kean D-20261109-no-push-runs). Push-started
# runs raced each other and the result commits, and most were refused as stale; a tag push
# started them too. .github/scripts/test_workflow_triggers.py fails if a push or
# pull_request trigger is added back.

name: Run jobs

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily: a sweep, plus jobs with a DAILY file and their consumers
    - cron: "47 */3 * * *" # every 3 hours: jobs changed since the previous sweep (own folder or triggers.txt), and their consumers
  workflow_dispatch:
    inputs:
      job:
        description: "Job folder name(s) under jobs/, separated by spaces (for example: claim-checker readiness-tracker)"
        required: true
      only:
        description: "Run exactly the named jobs, without the jobs that read their outputs (what a push used to do)"
        type: boolean
        default: false
      diagnostic:
        description: "Run named jobs only and retain receipts without publishing results"
        type: boolean
        default: false
      requeue_depth:
        description: "Set by Arsenale when it re-queues refused jobs (0 for an ordinary run; at most 2)"
        required: false
        default: "0"
      downstream:
        description: "Set by Arsenale: re-queued jobs that keep the downstream-only web-search budget"
        required: false
        default: ""
      continuation:
        description: "Set by Riquet when it continues the deferred part of a long run (0 for an ordinary run)"
        required: false
        default: "0"

# Each stage asks for its own permissions; only publish can write.
permissions:
  contents: read

# Leave Git LFS files (the multi-GB archive parts) as small pointer files unless
# a job downloads one itself with `git lfs pull --include "<path>"`.
env:
  GIT_LFS_SKIP_SMUDGE: "1"

# Arsenale (.github/scripts/arsenale.py): plan, execute and publish are separate
# jobs. Only publish holds the branch writer queue, which mutating runs and main
# progress reporting share; queue:max retains up to 100 pending publishers rather
# than replacing one. Execution needs no lock: every station runs on one pinned
# input commit, and publish checks each job's freshness against the latest tip.
# Read-only diagnostics keep their exact event checkout and never publish.

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read lets the sweep find the previous sweep's input commit in the run history.
    permissions:
      contents: read
      actions: read
    outputs:
      jobs: ${{ steps.plan.outputs.check_order }}
      direct: ${{ steps.pick.outputs.direct }}
      downstream: ${{ steps.pick.outputs.downstream }}
      input_commit: ${{ steps.plan.outputs.input_commit }}
      matrix: ${{ steps.plan.outputs.matrix }}
      deferred: ${{ steps.plan.outputs.deferred }}
    steps:
      # Keep job code/data in this non-cone bootstrap. In particular, a cone
      # checkout of jobs/ includes every nested output generation before the
      # picker knows which jobs will run. Each station's materialization step
      # adds selected inputs/prior generations for audited versions, or all jobs
      # for unaudited versions whose dynamic reads are not closed by declarations.
      - uses: actions/checkout@v4
        with:
          # Read-only, like execute: Riquet reads recent STATUS.json history (not checked
          # out) to estimate each job's duration. Diagnostics keep no credentials.
          persist-credentials: ${{ !inputs.diagnostic }}
          # No lock is held while executing. Production executes the branch tip
          # at plan time (pinned below for every station); diagnostics remain
          # pinned to their original event commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic && github.sha || github.ref }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/**
            /HANDOFF/**
            /jobs/**
            !/jobs/*/output/**
            /jobs/*/output/STATUS.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose which jobs to run
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic }}
          ONLY: ${{ github.event.inputs.only }}
          REQUEUE_DEPTH: ${{ github.event.inputs.requeue_depth }}
          CONTINUATION: ${{ github.event.inputs.continuation }}
          INPUT_DOWNSTREAM: ${{ github.event.inputs.downstream }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Read-only run history (actions: read above): the previous sweep's input commit.
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pick_jobs.py

      # A certified runtime-only push still runs claim-kit tests. Do not run the
      # compiler or restore old output generations merely to execute unit tests.
      # No push starts this workflow since 2026-11-09, so this is reached only by a
      # replayed push event; the road tests run the claim-kit tests on every pull request.
      - name: Materialize claim-kit test fixtures
        if: steps.pick.outputs.runtime_tests == 'claim-kit'
        run: git sparse-checkout add '/research/stage19/code/**' '/research/plans/claim_kit_contract/**'

      - name: Offline claim-kit runtime tests
        if: steps.pick.outputs.runtime_tests == 'claim-kit'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import socket, sys, unittest
          socket.create_connection = lambda *a, **k: (_ for _ in ()).throw(AssertionError('network forbidden in tests'))
          class NoNetworkSocket(socket.socket):
              def connect(self, *a, **k):
                  raise AssertionError('network forbidden in tests')
          socket.socket = NoNetworkSocket
          suite = unittest.defaultTestLoader.discover('jobs/claim-kit', pattern='test_*.py')
          sys.exit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())
          PY

      # Stations: jobs joined by after.txt run in order on one runner; others run
      # in parallel. The check order puts readers of another station's base
      # output before that producer, exactly as the freshness guard requires.
      - name: Plan parallel stations
        id: plan
        if: steps.pick.outputs.jobs != ''
        env:
          JOBS: ${{ steps.pick.outputs.jobs }}
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic }}
          CONTINUATION: ${{ github.event.inputs.continuation }}
          REQUEUE_DEPTH: ${{ github.event.inputs.requeue_depth }}
        run: python .github/scripts/arsenale.py plan

      - name: Summarize an empty selection
        continue-on-error: true
        if: always() && (steps.pick.outcome != 'success' || steps.pick.outputs.jobs == '')
        env:
          JOBS: ""
          PICK_OUTCOME: ${{ steps.pick.outcome }}
        run: python .github/scripts/job_summary.py

  execute:
    needs: plan
    if: needs.plan.outputs.jobs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # No concurrency group: stations of this run and of other runs execute at
    # the same time. Nothing here can write to the repository.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: "execute (station ${{ matrix.station }}: ${{ matrix.jobs }})"
    steps:
      - name: Record station start
        run: echo "ARSENALE_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ !inputs.diagnostic }}
          # Every station executes the one input commit the plan pinned.
          ref: ${{ needs.plan.outputs.input_commit }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/**
            /HANDOFF/**
            /jobs/**
            !/jobs/*/output/**

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One cache per station composition; v1 (the serial runner's single cache)
      # seeds stations that have none yet.
      - name: Restore each job's bounded download cache
        if: ${{ !inputs.diagnostic }}
        uses: actions/cache@v4
        with:
          path: .job-cache
          key: job-downloads-v2-${{ github.ref_name }}-${{ matrix.cache }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-downloads-v2-${{ github.ref_name }}-${{ matrix.cache }}-
            job-downloads-v1-${{ github.ref_name }}-

      - name: Read download cache for diagnostic jobs
        if: ${{ inputs.diagnostic }}
        uses: actions/cache/restore@v4
        with:
          path: .job-cache
          key: job-downloads-v2-${{ github.ref_name }}-${{ matrix.cache }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-downloads-v2-${{ github.ref_name }}-${{ matrix.cache }}-
            job-downloads-v1-${{ github.ref_name }}-

      - name: Materialize selected job inputs and prior outputs
        env:
          JOBS: ${{ matrix.jobs }}
        run: python .github/scripts/materialize_job_inputs.py

      # Ariadne (shadow): strace lets the runner record which tracked files each job reads
      # (.github/scripts/ariadne.py). Without strace the jobs simply run untraced.
      - name: Install the Ariadne tracer
        continue-on-error: true
        run: command -v strace >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq strace; }

      - name: Run the jobs
        env:
          JOBS: ${{ matrix.jobs }}
          ARIADNE_TRACE: "1"
          # Jobs running only because a job they read changed; web-search jobs among them get a small budget.
          DOWNSTREAM_ONLY: ${{ needs.plan.outputs.downstream }}
          TRIGGER: ${{ github.event_name }} by ${{ github.actor }}
          ARSENALE_INPUT_COMMIT: ${{ needs.plan.outputs.input_commit }}
          # Optional search keys for the Lewis/Clark web search (jobs/_lib/eo_websearch.py). Each is
          # empty unless the owner adds the secret under Settings -> Secrets and variables -> Actions;
          # an engine whose key is empty is skipped and listed as "needs_key" in the job summary.
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
          BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          # Encyclopedie (owner, 2026-11-06): CourtListener token and api.data.gov key, read by jobs/youngstown-courts and
          # jobs/repetita-lsa; empty until the owner adds the secrets of the same names.
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
        # Selection keeps the original event BEFORE/AFTER. Native receipts bind
        # to the actual checkout, which is the plan's pinned input commit.
        run: |
          execution_input_commit="$(git rev-parse HEAD)"
          test "$execution_input_commit" = "$ARSENALE_INPUT_COMMIT"
          env GITHUB_SHA="$execution_input_commit" bash .github/scripts/run_jobs.sh

      - name: Bundle this station's results
        if: always()
        env:
          JOBS: ${{ matrix.jobs }}
          ARSENALE_INPUT_COMMIT: ${{ needs.plan.outputs.input_commit }}
        run: python .github/scripts/arsenale.py bundle --station ${{ matrix.station }} --out arsenale-station

      - name: Hand the station's results to publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsenale-${{ github.run_id }}-${{ github.run_attempt }}-station-${{ matrix.station }}
          path: arsenale-station/
          if-no-files-found: error
          retention-days: 7

      # Keep only this station's jobs in its cache, so parallel stations do not
      # save copies of each other's downloads.
      - name: Trim the cache to this station's jobs
        if: always() && !inputs.diagnostic
        env:
          JOBS: ${{ matrix.jobs }}
        run: |
          shopt -s nullglob
          for dir in .job-cache/*/; do
            name="$(basename "$dir")"
            [[ " $JOBS " == *" $name "* ]] || rm -rf -- "$dir"
          done

  publish:
    needs: [plan, execute]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.jobs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only lock: held from the latest-tip checkout through the push.
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic && format('read-only-job-diagnostic-{0}-{1}', github.run_id, github.run_attempt) || format('repository-output-writer-{0}', github.ref) }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Record lock acquisition
        run: echo "ARSENALE_LOCK_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ !inputs.diagnostic }}
          # The writer lock is held before checkout: publish onto the latest
          # branch state. Diagnostics remain pinned to their original event commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic && github.sha || github.ref }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/**
            /HANDOFF/**
            /jobs/**
            !/jobs/*/output/**

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the stations' results
        uses: actions/download-artifact@v4
        with:
          pattern: arsenale-${{ github.run_id }}-${{ github.run_attempt }}-station-*
          path: arsenale-in

      - name: Collect the stations' results onto the latest branch tip
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
          ARSENALE_INPUT_COMMIT: ${{ needs.plan.outputs.input_commit }}
        run: python .github/scripts/arsenale.py collect --artifacts arsenale-in

      - name: Commit results to the branch
        id: publish
        if: ${{ !inputs.diagnostic }}
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -s oversized/runner-freshness/ATTEMPTS.json || { echo "::error::Missing current execution receipts"; exit 1; }
          bash .github/scripts/commit_results.sh

      # Bounded: a re-queued run carries requeue_depth; at depth 2 nothing is dispatched.
      # Riquet: the jobs the plan deferred continue here, counted by continuation, not depth.
      - name: Re-queue refused jobs on the current branch
        if: always() && !inputs.diagnostic && steps.publish.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEUE_DEPTH: ${{ github.event.inputs.requeue_depth }}
          CONTINUATION: ${{ github.event.inputs.continuation }}
          DEFERRED: ${{ needs.plan.outputs.deferred }}
          DOWNSTREAM_ONLY: ${{ needs.plan.outputs.downstream }}
          BRANCH: ${{ github.ref_name }}
        run: python .github/scripts/arsenale.py requeue --workflow run-jobs.yml

      - name: Keep oversized files as a download
        if: always() && !inputs.diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: oversized-outputs-${{ github.run_id }}
          path: oversized/
          if-no-files-found: ignore
          retention-days: 90

      - name: Keep diagnostic receipts
        if: always() && inputs.diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            oversized/runner-freshness/ATTEMPTS.json
            oversized/runner-freshness/CHECKOUT_INPUTS.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize selected jobs and publication
        continue-on-error: true
        if: always()
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
          DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic }}
          DIRECT_JOBS: ${{ needs.plan.outputs.direct }}
          PICK_OUTCOME: ${{ needs.plan.result }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLICATION: ${{ steps.publish.outputs.publication }}
          GITHUB_SHA: ${{ needs.plan.outputs.input_commit }}
        run: |
          if [[ -f .github/scripts/job_summary.py ]]; then
            python .github/scripts/job_summary.py
          else
            echo "Job summary unavailable: repository scripts were not checked out." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail when a station delivered no results
        if: always()
        run: python .github/scripts/arsenale.py verdict
