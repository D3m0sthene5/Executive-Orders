name: Isolated repair stall probe
on:
  push:
    branches: ['codex/stall-probe-20261020']
    paths: ['.github/workflows/repair-stall-probe.yml', 'jobs/_repair-stall-probe/**']
permissions:
  contents: read
env:
  GIT_LFS_SKIP_SMUDGE: '1'
  PYTHONUNBUFFERED: '1'
  TARGET_COMMIT: ec13121674cec5b92d910fe18dd361415e072ee4
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          lfs: false
          persist-credentials: false
          sparse-checkout: jobs/_repair-stall-probe
      - uses: actions/checkout@v4
        with:
          ref: ec13121674cec5b92d910fe18dd361415e072ee4
          path: target
          fetch-depth: 1
          filter: blob:none
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            jobs
            research/stage15/CENSUS
            research/progress
            research/stage19/code
            research/stage19/output
            research/stage20/output
            research/stage21/sources_index
            research/stage21/original_sources
            research/readiness
            research/stage20/sources
            research/stage18
            research/stage14/QUEUES
            releases/opus_stage11_complete
            releases/source_books
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r target/jobs/claim-drafts/requirements.txt
      - name: Full online draft replay (eight-minute diagnostic cap)
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 480s python -u controller/jobs/_repair-stall-probe/probe.py --repo target --output '${{ runner.temp }}/stall-online' --network-budget 400 --cases 3359 2>&1 | tee '${{ runner.temp }}/stall-online.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-stall-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stall-online.log
            ${{ runner.temp }}/stall-online/PROBE_SUMMARY.json
            ${{ runner.temp }}/stall-online/drafts/SUMMARY.json
